<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reinos de Etherial</title><link rel="stylesheet" href="src/styles.css?v=2"></head><body>
<main id="app"><section class="game-shell">
<header class="hud"><div><strong>REINOS DE ETHERIAL</strong><small id="zone">Aldea de Lumen</small></div><div class="bars"><label>HP <progress id="hp" max="100" value="100"></progress></label><label>MP <progress id="mp" max="100" value="60"></progress></label><label>EXP <progress id="xp" max="100" value="0"></progress></label></div><div class="stats"><b id="className">Guerrero</b> · Nv. <b id="level">1</b> · Oro <b id="gold">25</b></div></header>
<div class="stage"><canvas id="game" width="960" height="540"></canvas><section id="classSelect" class="modal"><div><h2>Elige tu clase</h2><p>Cada héroe tiene combate y habilidades diferentes.</p><button data-class="warrior">⚔️ Guerrero<small>Resistente · cuerpo a cuerpo</small></button><button data-class="archer">🏹 Arquero<small>Rápido · largo alcance</small></button><button data-class="mage">🔮 Mago<small>Magia · gran daño</small></button></div></section><aside id="quest" class="quest"><b>Misión: Primer entrenamiento</b><span>Derrota 3 criaturas: <strong id="questProgress">0/3</strong></span></aside></div>
<nav class="hotbar"><button data-skill="0">ESP<br><span>Ataque</span></button><button data-skill="1">1<br><span>Habilidad I</span></button><button data-skill="2">2<br><span>Habilidad II</span></button><button data-skill="3">3<br><span>Habilidad III</span></button><button data-skill="4">4<br><span>Habilidad IV</span></button></nav>
<div class="mobile"><div class="dpad"><button data-move="w">▲</button><span><button data-move="a">◀</button><button data-move="s">▼</button><button data-move="d">▶</button></span></div><button class="attackMobile" data-skill="0">⚔</button></div>
</section></main><script src="src/game.js?v=2"></script></body></html>
